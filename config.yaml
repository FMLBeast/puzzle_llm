# Puzzle LLM Training Configuration

# Model Configuration
model:
  # Base model to fine-tune (options: meta-llama/Llama-3.2-1B, mistralai/Mistral-7B-v0.1, etc.)
  name: "meta-llama/Llama-3.2-1B"
  max_seq_length: 512

  # LoRA configuration for efficient fine-tuning
  lora:
    r: 16  # Rank of LoRA matrices
    alpha: 32  # Scaling factor
    dropout: 0.05
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"

# Training Configuration
training:
  num_epochs: 3
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_steps: 100

  # Logging and saving
  logging_steps: 10
  save_steps: 100
  eval_steps: 50

  # Optimizer
  optimizer: "paged_adamw_32bit"
  lr_scheduler: "cosine"

  # Mixed precision
  fp16: true
  gradient_checkpointing: true

# Data Configuration
data:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

  # Data format (json, csv, txt)
  format: "json"

  # Expected fields in data
  fields:
    puzzle: ["puzzle", "question", "problem", "text"]
    solution: ["solution", "answer", "response"]
    hint: ["hint"]
    difficulty: ["difficulty"]
    category: ["category", "type"]

# Modal Configuration
modal:
  # GPU options: T4, A10G, A100
  gpu: "A10G"
  timeout: 86400  # 24 hours in seconds

  # Volume for persistent storage
  volume_name: "puzzle-llm-models"

  # Secrets (optional)
  wandb_enabled: false

# Model variants (uncomment to use)
# Alternative smaller models:
# model.name: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
# model.name: "microsoft/phi-2"

# Alternative larger models (requires more GPU memory):
# model.name: "meta-llama/Llama-3.2-3B"
# model.name: "mistralai/Mistral-7B-v0.1"
# modal.gpu: "A100"
